[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alfa-rag-demo"
version = "0.1.0"
description = "Local RAG demo (retrieval + decision + clarify + Ollama)"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.8",
    "joblib>=1.3",
    "langchain-text-splitters>=0.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "sentence-transformers>=2.7",
    "torch>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
